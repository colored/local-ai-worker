name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.21'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check src tests tools
      - run: uv build --wheel
      - name: Install and verify wheel outside checkout
        shell: bash
        run: |
          wheel="$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)"
          uv venv "$RUNNER_TEMP/wheel-smoke" --python '${{ matrix.python }}'
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" "$wheel"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" "$GITHUB_WORKSPACE/tools/verify_wheel.py" "$wheel" | tee wheel-report.txt
          cat wheel-report.txt >> "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/wheel-smoke/bin/local-ai" --help
