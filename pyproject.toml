[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "local-ai-worker"
version = "0.1.0"
description = "A read-only local repository, diff, and log worker for Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp==1.30.0", "pydantic>=2.12,<3", "httpx>=0.28,<1",
  "typer>=0.21,<1", "platformdirs>=4.5,<5", "regex>=2025.11",
  "tokenizers>=0.22,<1",
]

[project.scripts]
local-ai = "local_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/local_ai"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.15,<1", "build>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
